# ========================================
# ECOZII E-SALON APPLICATION CONFIGURATION
# ========================================

# ========== APPLICATION INFO ==========
spring.application.name=e-salon
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Info
info.app.name=Ecozii E-Salon
info.app.description=Online Salon Booking and Management System
info.app.version=1.0.0

# ========== DATABASE CONFIGURATION ==========
# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esalon_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========== JPA / HIBERNATE CONFIGURATION ==========
# Hibernate DDL auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate additional properties
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ========== LOGGING CONFIGURATION ==========
# Logging levels
logging.level.root=INFO
logging.level.com.ecozii.esalon=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file
logging.file.name=logs/esalon.log
logging.file.max-size=10MB
logging.file.max-history=30

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========== JWT CONFIGURATION ==========
# JWT Configuration
jwt.secret=${JWT_SECRET:ecozii-esalon-dev-secret-key-min-32-chars}
jwt.expiration=86400000
# 86400000ms = 24 hours
# JWT expiration time in milliseconds (86400000 = 24 hours)
jwt.refresh.expiration=604800000
# Refresh token expiration (604800000 = 7 days)

# ========== SECURITY CONFIGURATION ==========
# Enable/Disable security


# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ========== STRIPE PAYMENT CONFIGURATION ==========
# Stripe API Keys (Get from https://dashboard.stripe.com/apikeys)
stripe.api.key=${STRIPE_API_KEY:sk_test_your_stripe_secret_key_here}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
stripe.currency=inr
# Supported: usd, eur, gbp, inr

# ========== GOOGLE MAPS CONFIGURATION ==========
# Google Maps API Key (Get from https://console.cloud.google.com/)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}
google.maps.default.radius=10000
# Default search radius in meters (10000 = 10km)


# AWS S3 Configuration

# AWS SQS Configuration
aws.sqs.queue.url=https://sqs.us-east-1.amazonaws.com/your-account-id/ecozii-salon-queue

# AWS SNS Configuration
aws.sns.topic.arn=arn:aws:sns:us-east-1:your-account-id:ecozii-salon-notifications

# AWS SES Configuration
aws.ses.from.email=noreply@ecozii.com
aws.ses.from.name=Ecozii E-Salon

# ========== EMAIL CONFIGURATION ==========
# SMTP Configuration (Alternative to AWS SES)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email settings
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# ========== SMS CONFIGURATION (TWILIO) ==========
# Twilio Configuration (Optional - for SMS notifications)
twilio.account.sid=${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}

# ========== FILE UPLOAD CONFIGURATION ==========
# Multipart file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# File upload directory (local storage)
file.upload.dir=uploads/
file.upload.images.dir=uploads/images/
file.upload.documents.dir=uploads/documents/

# ========== CACHE CONFIGURATION ==========
# Cache settings
spring.cache.type=caffeine
spring.cache.cache-names=salons,services,appointments,users
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ========== SCHEDULER CONFIGURATION ==========
# Enable scheduling
spring.task.scheduling.pool.size=5

# Appointment reminder cron (Run every hour)
appointment.reminder.cron=0 0 * * * ?
# Queue update cron (Run every 5 minutes)
queue.update.cron=0 */5 * * * ?

# ========== WEBSOCKET CONFIGURATION ==========
# WebSocket settings for real-time updates
websocket.allowed-origins=http://localhost:3000,http://localhost:8080

# ========== API DOCUMENTATION (SWAGGER) ==========
# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=true

# API Info
springdoc.api-docs.info.title=Ecozii E-Salon API
springdoc.api-docs.info.description=REST API for Ecozii E-Salon Booking System
springdoc.api-docs.info.version=1.0.0
springdoc.api-docs.info.contact.name=Ecozii Team
springdoc.api-docs.info.contact.email=support@ecozii.com

# ========== ACTUATOR CONFIGURATION ==========
# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true

# Health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# ========== JACKSON CONFIGURATION ==========
# JSON serialization/deserialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ========== ERROR HANDLING ==========
# Error response configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ========== SESSION CONFIGURATION ==========
# Session management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# Set to true in production with HTTPS

# ========== BUSINESS CONFIGURATION ==========
# Business rules
business.booking.advance.days=30
# Maximum days in advance for booking
business.slot.duration.minutes=30
# Default time slot duration
business.max.daily.appointments=50
# Maximum appointments per day
business.cancellation.hours=24
# Free cancellation hours before appointment
business.working.hours.start=09:00
business.working.hours.end=20:00

# ========== RATE LIMITING ==========
# API rate limiting
rate.limit.enabled=true
rate.limit.requests.per.minute=60

# ========== DEVELOPMENT SETTINGS ==========
# Development mode settings (disable in production)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.h2.console.enabled=false

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:esalon-profile-image}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:change-me}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:change-me}

# Max file upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_change_me}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:change-me}
razorpay.currency=INR




# ========== PRODUCTION OVERRIDES ==========
# These should be overridden in production via environment variables
# SPRING_DATASOURCE_PASSWORD=production_password
# JWT_SECRET=production_secret_key
# STRIPE_API_KEY=sk_live_production_key
# GOOGLE_MAPS_API_KEY=production_api_key
# AWS_ACCESS_KEY_ID=production_access_key
# AWS_SECRET_ACCESS_KEY=production_secret_key

# ========================================
# END OF CONFIGURATION
# ========================================
